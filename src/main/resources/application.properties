spring.datasource.url=jdbc:h2:file:./data/connect;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Errors are sent to the app as {"message": ...} by ApiErrors; internal details are never exposed.
server.error.include-message=never

# Stay signed in. Sessions are kept in the database (so a server restart does not sign anyone out)
# and the login cookie lasts as long as browsers allow (about 400 days).
server.servlet.session.timeout=400d
spring.session.timeout=400d
server.servlet.session.cookie.max-age=400d
server.servlet.session.cookie.http-only=true
spring.session.jdbc.initialize-schema=never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:session-schema.sql

# Voice notes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Calls: STUN is free and enough for testing. For real-world use add a TURN server
# (for example coturn) and fill in the three TURN lines below.
zavelo.ice.stun=stun:stun.l.google.com:19302
zavelo.ice.turn.url=
zavelo.ice.turn.username=
zavelo.ice.turn.credential=

# Hosting: Render tells the app which port to use. Locally this is 8080.
server.port=${PORT:8080}
# Where voice notes and files are kept. On Render this is the persistent disk (see application-prod.properties).
zavelo.data-dir=data
