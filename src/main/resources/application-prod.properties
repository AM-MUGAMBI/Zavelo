# Used on Render (SPRING_PROFILES_ACTIVE=prod). The DB_* values come from render.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Render sits in front of the app and handles HTTPS; this makes Spring see the real https address.
server.forward-headers-strategy=framework

# Login cookie: only over HTTPS, not readable by scripts, never sent from other sites.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

zavelo.data-dir=${DATA_DIR:/var/data}
