# Used on Render (SPRING_PROFILES_ACTIVE=prod). The DB_* values come from render.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Render sits in front of the app and handles HTTPS; this makes Spring see the real https address.
server.forward-headers-strategy=framework

# Login cookie: only over HTTPS and not readable by scripts.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

zavelo.data-dir=${DATA_DIR:/var/data}

# Render's database closes idle connections. Refresh them often so the first request after a quiet
# spell does not fail.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
